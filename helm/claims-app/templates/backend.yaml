apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: claims-backend
  template:
    metadata:
      labels:
        app: claims-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}

          env:
            - name: DB_HOST
              value: claims-db

            - name: DB_PORT
              value: {{ .Values.database.service.port | quote }}

            - name: DB_NAME
              value: {{ .Values.database.name | quote }}

            - name: DB_USER
              value: {{ .Values.database.user | quote }}

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name }}
                  key: {{ .Values.database.passwordSecret.key }}

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessPath }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessPath }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: claims-backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: claims-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}