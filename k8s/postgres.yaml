apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-db-init
  namespace: usecase4
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(150) UNIQUE NOT NULL,
        password_hash TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS claims (
        id SERIAL PRIMARY KEY,
        claim_number VARCHAR(20) UNIQUE,
        customer_name VARCHAR(100) NOT NULL,
        amount NUMERIC(12,2) NOT NULL,
        description TEXT,
        status VARCHAR(20) DEFAULT 'Pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE SEQUENCE IF NOT EXISTS claim_number_seq START 1;

    CREATE OR REPLACE FUNCTION generate_claim_number()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.claim_number :=
            'CLM-' || LPAD(nextval('claim_number_seq')::TEXT, 4, '0');
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS claim_number_trigger ON claims;

    CREATE TRIGGER claim_number_trigger
    BEFORE INSERT ON claims
    FOR EACH ROW
    WHEN (NEW.claim_number IS NULL)
    EXECUTE FUNCTION generate_claim_number();

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-db
  namespace: usecase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-db
  template:
    metadata:
      labels:
        app: claims-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: claimsdb
            - name: POSTGRES_USER
              value: claimsuser
            - name: POSTGRES_PASSWORD
              value: claimspassword
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-script
          configMap:
            name: claims-db-init

---
apiVersion: v1
kind: Service
metadata:
  name: claims-db
  namespace: usecase4
spec:
  selector:
    app: claims-db
  ports:
    - port: 5432
      targetPort: 5432