apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-frontend
  namespace: usecase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-frontend
  template:
    metadata:
      labels:
        app: claims-frontend
    spec:
      containers:
        - name: frontend
          image: claims-frontend:usecase4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: claims-frontend
  namespace: usecase4
spec:
  type: NodePort
  selector:
    app: claims-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080