workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - quality
  - build
  - scan
  - publish

default:
  tags:
    - windows-shell

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  IMAGE_ARCHIVE: "backend-image.tar"
  DOCKER_BUILDKIT: "1"

cache:
  key: "python-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

test_backend:
  stage: test
  before_script:
    - python --version
    - python -m venv .venv-ci
    - .\.venv-ci\Scripts\python.exe -m pip install --upgrade pip
    - .\.venv-ci\Scripts\python.exe -m pip install -r backend\requirements-dev.txt
  script:
    - .\.venv-ci\Scripts\python.exe -m pytest backend\tests -v --junitxml=backend\test-results.xml
  artifacts:
    when: always
    reports:
      junit: backend/test-results.xml
    paths:
      - backend/test-results.xml
    expire_in: 1 week

sonarqube_quality:
  stage: quality
  before_script:
    - 'if (-not $env:SONAR_HOST_URL -or -not $env:SONAR_TOKEN -or -not $env:SONAR_PROJECT_KEY) { throw "Set SONAR_HOST_URL, SONAR_TOKEN, and SONAR_PROJECT_KEY in GitLab CI/CD variables." }'
    - docker version
  script:
    - 'docker run --rm -e SONAR_HOST_URL="$env:SONAR_HOST_URL" -e SONAR_TOKEN="$env:SONAR_TOKEN" -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli:latest "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" "-Dsonar.sources=." "-Dsonar.exclusions=frontend/node_modules/**,backend/venv/**,.venv-ci/**" "-Dsonar.python.version=3.10" "-Dsonar.qualitygate.wait=true"'
build_backend_image:
  stage: build
  before_script:
    - docker version
  script:
    - docker build --pull --provenance=false --sbom=false --tag "$env:IMAGE_TAG" --file backend/Dockerfile backend
    - docker image inspect "$env:IMAGE_TAG"
    - docker save --output "$env:IMAGE_ARCHIVE" "$env:IMAGE_TAG"
  artifacts:
    paths:
      - backend-image.tar
    expire_in: 1 day

trivy_scan:
  stage: scan
  needs:
    - job: build_backend_image
      artifacts: true
  script:
    - 'docker run --rm -v "${PWD}:/work" aquasec/trivy:latest image --input /work/backend-image.tar --skip-files "/usr/local/lib/python3.10/site-packages/pip/_vendor/bom.cdx.json" --ignore-unfixed --format json --output /work/trivy-report.json'
    - 'docker run --rm -v "${PWD}:/work" aquasec/trivy:latest image --input /work/backend-image.tar --skip-files "/usr/local/lib/python3.10/site-packages/pip/_vendor/bom.cdx.json" --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL'
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 1 week

publish_backend_image:
  stage: publish
  needs:
    - job: build_backend_image
      artifacts: true
    - job: trivy_scan
  before_script:
    - docker load --input "$env:IMAGE_ARCHIVE"
  script:
    - '$env:CI_REGISTRY_PASSWORD | docker login --username "$env:CI_REGISTRY_USER" --password-stdin "$env:CI_REGISTRY"'
    - docker push "$env:IMAGE_TAG"
    - 'docker buildx imagetools inspect "$env:IMAGE_TAG" | Tee-Object -FilePath image-digest.txt'
  after_script:
    - docker logout "$env:CI_REGISTRY"
  artifacts:
    when: always
    paths:
      - image-digest.txt
    expire_in: 1 week
