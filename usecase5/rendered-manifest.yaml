---
# Source: claims-app/templates/postgres.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-db
  template:
    metadata:
      labels:
        app: claims-db
    spec:
      containers:
        - name: postgres
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "claimsdb"

            - name: POSTGRES_USER
              value: "claimsuser"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-db-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: init-script
          configMap:
            name: claims-db-init
