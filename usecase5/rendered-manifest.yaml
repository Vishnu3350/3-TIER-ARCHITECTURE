---
# Source: claims-app/templates/postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: claims-db
spec:
  selector:
    app: claims-db
  ports:
    - port: 5432
      targetPort: 5432
---
# Source: claims-app/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-backend
  template:
    metadata:
      labels:
        app: claims-backend
    spec:
      containers:
        - name: backend
          image: "claims-backend:usecase4"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: claims-db

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "claimsdb"

            - name: DB_USER
              value: "claimsuser"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-db-secret
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10


